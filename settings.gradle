pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Strata-Docs'

// Strata itself, built from the sibling checkout until it is published
includeBuild('../Strata') {
    dependencySubstitution {
        ['api', 'spi', 'core', 'canvas-swing'].each { name ->
            substitute(module("org.inspirenxe:strata-${name}")).using(project(":${name}"))
        }
    }
}

// The code the documentation site shows, compiled so it stays correct
include('docs-examples')
