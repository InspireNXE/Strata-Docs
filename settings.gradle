pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Strata-Docs'

// Strata itself, from the checkout beside this one. The site documents the source it is built from, so it always
// includes the checkouts, and its Javadoc and design pages come from them too.
includeBuild('../Strata') {
    dependencySubstitution {
        ['api', 'spi', 'core'].each { name ->
            substitute(module("org.inspirenxe:strata-${name}")).using(project(":${name}"))
        }
    }
}

// The Java2D/Swing adapter, from the Strata-Swing checkout beside this one
includeBuild('../Strata-Swing') {
    dependencySubstitution {
        substitute(module('org.inspirenxe:strata-swing')).using(project(':'))
    }
}


// The Vulkan adapter, from the Strata-Vulkan checkout beside this one
includeBuild('../Strata-Vulkan') {
    dependencySubstitution {
        substitute(module('org.inspirenxe:strata-vulkan')).using(project(':'))
    }
}
