name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Strata-Docs builds against Strata and Strata-Swing through includeBuild, so the three sit side by side
      - uses: actions/checkout@v4
        with:
          path: Strata-Docs

      - uses: actions/checkout@v4
        with:
          repository: InspireNXE/Strata
          path: Strata

      # The Java2D/Swing adapter the examples run on, also a sibling checkout
      - uses: actions/checkout@v4
        with:
          repository: InspireNXE/Strata-Swing
          path: Strata-Swing

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # Compiles and tests the examples the pages include, then builds every library's Javadoc into docs/javadoc
      - name: Check examples and build Javadoc
        working-directory: Strata-Docs
        run: ./gradlew build siteJavadoc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Strata-Docs/docs/requirements.txt

      - name: Build site
        working-directory: Strata-Docs
        run: |
          pip install -r docs/requirements.txt
          mkdocs build

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: Strata-Docs/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
