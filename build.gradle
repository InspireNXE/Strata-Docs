plugins {
    id 'java-library'
}

description = 'The Strata documentation site. The code its pages show is compiled and tested here, so every example stays correct.'

base {
    archivesName = 'strata-docs-examples'
}

repositories {
    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-serial', '-Xlint:-processing', '-Xlint:-classfile'])
}

dependencies {
    // What a mod or game compiles against, taken from the Strata and Strata-Swing checkouts this build includes
    implementation("org.inspirenxe:strata-api:${strata_version}")
    implementation("org.inspirenxe:strata-swing:${strata_version}")
    // The adapter guide's example engine creates hosts and runs the SPI contract tests
    implementation("org.inspirenxe:strata-spi:${strata_version}")
    implementation("org.inspirenxe:strata-core:${strata_version}")
    testImplementation(testFixtures("org.inspirenxe:strata-spi:${strata_version}"))
    // The testing guide's examples drive screens with core's test kit
    testImplementation(testFixtures("org.inspirenxe:strata-core:${strata_version}"))
    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty('java.awt.headless', 'true')
}

// Renders the example screens to the PNGs the pages show
tasks.register('renderDocImages', JavaExec) {
    group = 'documentation'
    description = 'Renders the documentation example screens to docs/assets/images.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.inspirenxe.strata.examples.RenderDocImages'
    args(file('docs/assets/images').absolutePath)
    systemProperty('java.awt.headless', 'true')
}

// The Javadoc of every Strata library, copied into docs/javadoc so the site can link to docs/javadoc/<project>/.
// The Javadoc is built by the Strata checkout this build includes (../Strata), so run it after changing Strata's API.
tasks.register('siteJavadoc', Sync) {
    group = 'documentation'
    description = 'Builds the Javadoc of every Strata library and copies it into docs/javadoc for the documentation site.'
    ['api', 'spi', 'core'].each { name ->
        dependsOn(gradle.includedBuild('Strata').task(":${name}:javadoc"))
        from(file("../Strata/${name}/build/docs/javadoc")) {
            into(name)
        }
    }
    // The Swing adapter's Javadoc comes from the Strata-Swing checkout
    dependsOn(gradle.includedBuild('Strata-Swing').task(':javadoc'))
    from(file('../Strata-Swing/build/docs/javadoc')) {
        into('swing')
    }
    into(layout.projectDirectory.dir('docs/javadoc'))
}
