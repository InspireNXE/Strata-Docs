plugins {
    id 'java-library'
}

description = 'The code shown on the documentation site. Pages include it by section, so every example compiles.'

base {
    archivesName = 'strata-docs-examples'
}

repositories {
    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-serial', '-Xlint:-processing', '-Xlint:-classfile'])
}

dependencies {
    // What a mod or game compiles against, taken from the Strata checkout this build includes
    implementation("org.inspirenxe:strata-api:${strata_version}")
    implementation("org.inspirenxe:strata-canvas-swing:${strata_version}")
    // The adapter guide's example engine creates hosts and runs the SPI contract tests
    implementation("org.inspirenxe:strata-spi:${strata_version}")
    implementation("org.inspirenxe:strata-core:${strata_version}")
    testImplementation(testFixtures("org.inspirenxe:strata-spi:${strata_version}"))
    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty('java.awt.headless', 'true')
}

// Renders the example screens to the PNGs the pages show
tasks.register('renderDocImages', JavaExec) {
    group = 'documentation'
    description = 'Renders the documentation example screens to docs/assets/images.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.inspirenxe.strata.examples.RenderDocImages'
    args(rootProject.file('docs/assets/images').absolutePath)
    systemProperty('java.awt.headless', 'true')
}
